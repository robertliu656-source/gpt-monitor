name: Build Windows
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r windows/requirements.txt
      - name: Tests and English build
        run: ./windows/build.ps1 en
      - name: SAPI and shortcut smoke test
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$pwd/app_files;$pwd/windows"
          python windows/gpt_monitor_windows.py --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Windows SAPI or hotkey smoke test failed' }
          $Wav = Join-Path $env:LOCALAPPDATA 'OpenClose/GPT Monitor/smoke-test.wav'
          if ((Get-Item $Wav).Length -lt 100) { throw 'Speech file is empty' }
          $p = Start-Process -FilePath dist/GPTMonitor_Windows_0.2.0-en/GPTMonitor.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Packaged smoke test timed out' }
          if ($p.ExitCode -ne 0) { throw 'Packaged smoke test failed' }
      - name: Chinese build
        run: ./windows/build.ps1 zh
      - uses: actions/upload-artifact@v4
        with:
          name: GPT-Monitor-Windows
          path: dist/GPT-Monitor-0.2.0-Windows-*-x64.zip
          if-no-files-found: error
